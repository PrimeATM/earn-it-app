<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Earn It — a family chore and allowance ledger.">
<style>body{margin:0;font:14px system-ui,sans-serif;} img{max-width:100%;} [hidden]{display:none!important;}</style>
</head>
<body>
<title>Earn It Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Karla:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root{
    --bg:#eef1e8;
    --surface:#ffffff;
    --surface-2:#f7f6ee;
    --ink:#1f2c22;
    --ink-soft:#5c6b5f;
    --ink-faint:#8b9a8d;
    --line:#d8dcc8;
    --line-strong:#b9c2a6;
    --accent:#bf7326;
    --accent-ink:#7a4718;
    --accent-soft:#f3e3c8;
    --pine:#2f6a3d;
    --pine-soft:#e2eee2;
    --rust:#a8402a;
    --rust-soft:#f5e2dc;
    --shadow: 0 1px 0 rgba(31,44,34,0.05), 0 8px 20px -12px rgba(31,44,34,0.25);
    --radius: 14px;
    --wheel-1:#2f6a3d; --wheel-2:#bf7326; --wheel-3:#a8402a;
    --wheel-4:#5b7f4b; --wheel-5:#2c6a67; --wheel-6:#7a5288;
    --spend:#bf7326; --save:#2f6a3d; --invest:#2c6a67;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161e18;
      --surface:#202b22;
      --surface-2:#1a231c;
      --ink:#eef1e8;
      --ink-soft:#aab8ac;
      --ink-faint:#7c8a7e;
      --line:#354034;
      --line-strong:#48573f;
      --accent:#e2a355;
      --accent-ink:#f5d9a8;
      --accent-soft:#3a2f1d;
      --pine:#7bc48a;
      --pine-soft:#20362a;
      --rust:#e2836c;
      --rust-soft:#3a2420;
      --shadow: 0 1px 0 rgba(0,0,0,0.2), 0 8px 24px -12px rgba(0,0,0,0.6);
      --wheel-1:#3d8a51; --wheel-2:#d98b34; --wheel-3:#c05038;
      --wheel-4:#6f9a5c; --wheel-5:#38857f; --wheel-6:#9a6ba6;
      --spend:#e2a355; --save:#7bc48a; --invest:#4fa79f;
    }
  }
  :root[data-theme="dark"]{
    --bg:#161e18;
    --surface:#202b22;
    --surface-2:#1a231c;
    --ink:#eef1e8;
    --ink-soft:#aab8ac;
    --ink-faint:#7c8a7e;
    --line:#354034;
    --line-strong:#48573f;
    --accent:#e2a355;
    --accent-ink:#f5d9a8;
    --accent-soft:#3a2f1d;
    --pine:#7bc48a;
    --pine-soft:#20362a;
    --rust:#e2836c;
    --rust-soft:#3a2420;
    --shadow: 0 1px 0 rgba(0,0,0,0.2), 0 8px 24px -12px rgba(0,0,0,0.6);
    --wheel-1:#3d8a51; --wheel-2:#d98b34; --wheel-3:#c05038;
    --wheel-4:#6f9a5c; --wheel-5:#38857f; --wheel-6:#9a6ba6;
    --spend:#e2a355; --save:#7bc48a; --invest:#4fa79f;
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:Karla, 'Segoe UI', system-ui, sans-serif;
    padding: 0 16px 64px;
    line-height:1.45;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  h1,h2,h3{font-family:'Zilla Slab', Georgia, serif; text-wrap:balance; margin:0;}
  .wrap{max-width:760px; margin:0 auto;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  input, select{font-family:inherit;}

  /* ---------- topbar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:22px 0 14px; border-bottom:3px double var(--line-strong);
    flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:38px; height:38px; border-radius:50%; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; font-family:'Zilla Slab'; font-weight:700; font-size:1.15rem;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,0.35);
    flex:none;
  }
  .brand h1{font-size:1.5rem; font-weight:700; letter-spacing:0.01em;}
  .brand small{display:block; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.12em; color:var(--ink-faint); font-weight:600;}
  .topbar-actions{display:flex; align-items:center; gap:8px;}

  .pill-btn{
    border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);
    padding:8px 14px; border-radius:999px; font-size:0.82rem; font-weight:600;
    display:inline-flex; align-items:center; gap:6px; transition:transform .08s ease, background .15s ease;
  }
  .pill-btn:active{transform:scale(0.96);}
  .pill-btn.on{background:var(--pine); border-color:var(--pine); color:#fff;}

  /* ---------- kid tabs ---------- */
  .kidtabs{display:flex; gap:8px; overflow-x:auto; padding:16px 0 4px; scrollbar-width:thin;}
  .tab{
    flex:none; display:flex; align-items:center; gap:8px; padding:9px 16px 9px 10px;
    background:var(--surface-2); border:1px solid var(--line); border-bottom:3px solid var(--line);
    border-radius:10px 10px 4px 4px; font-weight:700; font-family:'Zilla Slab'; font-size:1rem; color:var(--ink-soft);
  }
  .tab .tab-emoji{font-size:1.15rem;}
  .tab.active{background:var(--surface); border-color:var(--line-strong); border-bottom-color:var(--accent); color:var(--ink); box-shadow:var(--shadow);}
  .tab.add{color:var(--accent-ink); border-style:dashed;}

  /* ---------- cards ---------- */
  main{padding-top:18px; display:flex; flex-direction:column; gap:18px;}
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px; box-shadow:var(--shadow);
  }
  .card-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
  .card-head h2{font-size:1.05rem;}
  .eyebrow{font-size:0.72rem; text-transform:uppercase; letter-spacing:0.12em; color:var(--ink-faint); font-weight:700;}

  /* ---------- paystub ---------- */
  .paystub{background:linear-gradient(180deg, var(--surface), var(--surface-2)); position:relative; overflow:hidden;}
  .paystub::before{
    content:""; position:absolute; inset:0 0 auto 0; height:6px;
    background:repeating-linear-gradient(90deg, var(--accent) 0 10px, transparent 10px 20px);
    opacity:0.5;
  }
  .stub-row{display:flex; align-items:flex-end; justify-content:space-between; gap:18px; flex-wrap:wrap;}
  .balance-label{font-size:0.78rem; text-transform:uppercase; letter-spacing:0.12em; color:var(--ink-faint); font-weight:700; margin-bottom:4px;}
  .balance-num{
    font-family:'Space Mono', monospace; font-weight:700; font-variant-numeric:tabular-nums;
    font-size:clamp(2.3rem, 9vw, 3.2rem); color:var(--pine); line-height:1;
    transition:transform .25s cubic-bezier(.34,1.56,.64,1);
  }
  .balance-num.bump{transform:scale(1.08) rotate(-1deg);}
  .stub-side{text-align:right; font-family:'Space Mono', monospace; font-size:0.95rem; color:var(--ink-soft);}
  .buckets{display:grid; grid-template-columns:repeat(auto-fit, minmax(112px,1fr)); gap:10px; margin-top:18px;}
  .bucket{
    padding:11px 13px; border-radius:10px; background:var(--surface);
    border:1px solid var(--line); border-left:3px solid var(--b);
  }
  .bucket-label{font-size:0.67rem; text-transform:uppercase; letter-spacing:0.1em; font-weight:700; color:var(--ink-faint);}
  .bucket-amt{
    font-family:'Space Mono', monospace; font-weight:700; font-size:1.2rem;
    font-variant-numeric:tabular-nums; color:var(--b); line-height:1.3;
  }
  .bucket-sub{font-size:0.72rem; color:var(--ink-faint); margin-top:1px; line-height:1.35;}
  .bucket-sub .up{color:var(--pine); font-weight:700;}
  .bucket-sub .down{color:var(--rust); font-weight:700;}
  .goal-bar{height:5px; border-radius:3px; background:var(--line); margin-top:7px; overflow:hidden;}
  .goal-bar span{display:block; height:100%; background:var(--b); border-radius:3px;}
  .split-off-note{font-size:0.76rem; color:var(--ink-faint); margin-top:12px;}
  .pct-row{display:flex; gap:8px;}
  .pct-row .field{flex:1; margin-bottom:0;}
  .pct-sum{font-size:0.78rem; margin-top:8px; color:var(--ink-faint);}
  .pct-sum.bad{color:var(--rust); font-weight:700;}
  .toggle-line{display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--surface-2); border:1px solid var(--line); border-radius:9px; margin-bottom:14px;}
  .toggle-line input{width:18px; height:18px; accent-color:var(--pine);}
  .toggle-line label{font-size:0.88rem; font-weight:600; color:var(--ink); text-transform:none; letter-spacing:0;}

  .stub-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:16px;}
  .btn{
    border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);
    padding:9px 14px; border-radius:8px; font-weight:700; font-size:0.85rem;
  }
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.ghost{background:transparent;}
  .btn.rust{color:var(--rust); border-color:var(--rust);}
  .btn.small{padding:6px 10px; font-size:0.78rem; border-radius:7px;}
  .btn[disabled]{opacity:0.45; cursor:not-allowed;}

  /* ---------- punch card ---------- */
  .punch-wrap{overflow-x:auto;}
  table.punch{border-collapse:collapse; width:100%; min-width:480px;}
  table.punch th{
    font-family:'Space Mono'; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--ink-faint); padding:0 6px 10px; text-align:center; font-weight:700;
  }
  table.punch th.chore-h{text-align:left; padding-left:2px;}
  table.punch td{padding:9px 6px; text-align:center; border-top:1px dashed var(--line);}
  .chore-cell{display:flex; align-items:center; gap:10px; text-align:left;}
  .chore-emoji{font-size:1.2rem; flex:none;}
  .chore-title{font-weight:600; font-size:0.92rem;}
  .chore-value{font-family:'Space Mono'; font-size:0.76rem; color:var(--ink-faint);}
  .punch-btn{
    width:30px; height:30px; border-radius:50%; border:2px solid var(--line-strong); background:var(--surface-2);
    position:relative; padding:0;
  }
  .punch-btn.checked{background:var(--pine); border-color:var(--pine);}
  .punch-btn.checked::after{
    content:"✓"; color:#fff; font-size:0.85rem; font-weight:700; position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
  }
  .punch-btn.off{opacity:0.25; border-style:dashed;}
  .punch-btn.waiting{background:var(--accent); border-color:var(--accent);}
  .punch-btn.waiting::after{content:"⏳"; font-size:0.7rem;}
  .punch-btn.checked.duty{background:var(--ink-faint); border-color:var(--ink-faint);}

  .stub-pending{color:var(--accent); font-weight:700;}
  .streak{
    margin-top:14px; padding:9px 13px; border-radius:9px; background:var(--pine-soft);
    color:var(--pine); font-size:0.85rem; font-weight:600; display:inline-block;
  }

  /* ---------- approval queue ---------- */
  .approve-card{border-color:var(--accent); border-width:2px;}

  /* ---------- leaderboard ---------- */
  .board{display:flex; flex-direction:column; gap:10px;}
  .board-row{display:flex; align-items:center; gap:12px;}
  .board-name{font-weight:700; font-size:0.9rem; flex:none; min-width:90px;}
  .board-track{flex:1; height:14px; background:var(--surface-2); border-radius:7px; overflow:hidden; border:1px solid var(--line);}
  .board-track span{display:block; height:100%; background:var(--pine); border-radius:7px;}
  .board-amt{font-family:'Space Mono', monospace; font-weight:700; font-size:0.9rem; flex:none;}

  /* ---------- kitchen display ---------- */
  .display{padding:24px 0 40px;}
  .display-top{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:26px;}
  .display-top h1{font-size:clamp(1.6rem,4vw,2.4rem);}
  .display-date{font-family:'Space Mono', monospace; color:var(--ink-faint); font-size:0.95rem; margin-top:4px;}
  .display-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(260px,1fr)); gap:18px;}
  .display-card{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:22px; box-shadow:var(--shadow);
  }
  .display-name{font-family:'Zilla Slab', Georgia, serif; font-weight:700; font-size:clamp(1.3rem,3vw,1.7rem);}
  .display-bal{
    font-family:'Space Mono', monospace; font-weight:700; color:var(--pine);
    font-size:clamp(2.2rem,6vw,3rem); line-height:1.1; margin:4px 0;
  }
  .display-streak{color:var(--accent-ink); font-weight:700; font-size:0.95rem; margin-bottom:10px;}
  .display-left-h{font-size:0.72rem; text-transform:uppercase; letter-spacing:0.12em; color:var(--ink-faint); font-weight:700; margin:14px 0 6px;}
  .display-chore{font-size:1.05rem; padding:4px 0; font-weight:600;}
  .display-done{color:var(--pine); font-weight:700; font-size:1.1rem; margin-top:14px;}
  .display-owed{
    margin-top:14px; padding:8px 12px; background:var(--accent-soft); color:var(--accent-ink);
    border-radius:8px; font-size:0.86rem; font-weight:700;
  }
  .punch-btn:not(.off):active{transform:scale(0.9);}
  .punch-total{font-family:'Space Mono'; font-weight:700; color:var(--pine);}
  .row-actions{display:flex; gap:4px; justify-content:flex-end;}
  .icon-btn{
    border:none; background:transparent; color:var(--ink-faint); font-size:0.85rem; padding:4px 6px; border-radius:6px;
  }
  .icon-btn:hover{background:var(--surface-2); color:var(--ink);}
  .empty-note{color:var(--ink-faint); font-size:0.88rem; padding:6px 2px;}

  /* ---------- ledger log ---------- */
  .log-list{display:flex; flex-direction:column;}
  .log-row{
    display:flex; align-items:center; gap:12px; padding:10px 2px; border-top:1px dashed var(--line);
  }
  .log-row:first-child{border-top:none;}
  .log-icon{width:30px; height:30px; border-radius:8px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:0.95rem; flex:none;}
  .log-main{flex:1; min-width:0;}
  .log-title{font-weight:600; font-size:0.9rem;}
  .log-date{color:var(--ink-faint); font-size:0.76rem;}
  .log-amt{font-family:'Space Mono'; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .log-amt.credit{color:var(--pine);}
  .log-amt.debit{color:var(--rust);}

  /* ---------- manage ---------- */
  .manage-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:520px){.manage-grid{grid-template-columns:1fr;}}
  .manage-item{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 12px; background:var(--surface-2); border-radius:9px; border:1px solid var(--line);}
  .manage-item .mi-label{font-weight:600; font-size:0.88rem; display:flex; align-items:center; gap:8px;}

  /* ---------- as-needed jobs ---------- */
  .task-list{display:flex; flex-direction:column;}
  .task-row{
    display:flex; align-items:center; gap:12px; padding:11px 2px;
    border-top:1px dashed var(--line); flex-wrap:wrap;
  }
  .task-row:first-child{border-top:none;}
  .task-emoji{font-size:1.35rem; flex:none;}
  .task-main{flex:1; min-width:150px;}
  .task-title{font-weight:600; font-size:0.95rem;}
  .task-sub{font-size:0.76rem; color:var(--ink-faint); margin-top:1px;}
  .task-sub strong{color:var(--pine);}
  .task-actions{display:flex; align-items:center; gap:6px; flex:none;}

  /* ---------- prizes owed ---------- */
  .owed-list{display:flex; flex-direction:column;}
  .owed-row{
    display:flex; align-items:center; gap:12px; padding:11px 12px; margin-top:8px;
    background:var(--accent-soft); border:1px solid var(--accent); border-radius:10px;
  }
  .owed-row:first-child{margin-top:0;}
  .owed-emoji{font-size:1.6rem; flex:none;}
  .owed-main{flex:1; min-width:0;}
  .owed-label{font-family:'Zilla Slab', Georgia, serif; font-weight:700; font-size:1.02rem; color:var(--accent-ink);}
  .owed-sub{font-size:0.74rem; color:var(--accent-ink); opacity:0.75;}
  .owed-wait{font-size:0.72rem; color:var(--accent-ink); opacity:0.7; font-weight:700; text-align:right; flex:none; max-width:90px;}
  .collected{margin-top:14px;}
  .collected summary{
    cursor:pointer; font-size:0.8rem; color:var(--ink-faint); font-weight:700;
    list-style:none; display:flex; align-items:center; gap:6px;
  }
  .collected summary::-webkit-details-marker{display:none;}
  .collected summary::before{content:"▸"; transition:transform .15s ease;}
  .collected[open] summary::before{transform:rotate(90deg);}
  .collected-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:7px 2px; border-top:1px dashed var(--line); font-size:0.86rem; color:var(--ink-soft);
  }

  /* ---------- big job wheel ---------- */
  .wheel-lane{display:flex; gap:22px; align-items:center; flex-wrap:wrap;}
  .wheel-stage{position:relative; width:min(330px, 82vw); flex:none; margin:0 auto;}
  .wheel-stage canvas{display:block; width:100%; aspect-ratio:1/1; max-width:100%; border-radius:50%;}
  .wheel-stage.dim canvas{opacity:0.45; filter:saturate(0.5);}
  .wheel-pointer{
    position:absolute; top:-4px; left:50%; transform:translateX(-50%); z-index:2;
    width:0; height:0; border-left:11px solid transparent; border-right:11px solid transparent;
    border-top:20px solid var(--ink); filter:drop-shadow(0 1px 1px rgba(0,0,0,0.25));
  }
  .wheel-side{flex:1; min-width:210px;}
  .wheel-side h3{font-family:'Zilla Slab'; font-size:1.05rem; margin-bottom:6px;}
  .wheel-side p{color:var(--ink-soft); font-size:0.88rem; margin:0 0 14px;}
  .wheel-label{
    display:inline-block; font-family:'Space Mono'; font-size:0.7rem; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--ink-faint); font-weight:700; margin-bottom:10px;
  }
  .quest{
    display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:12px;
    background:var(--surface-2); border:1px dashed var(--line-strong);
  }
  .quest-emoji{font-size:1.9rem; flex:none;}
  .quest-title{font-family:'Zilla Slab'; font-weight:700; font-size:1.1rem; line-height:1.2;}
  .quest-sub{font-size:0.8rem; color:var(--ink-faint);}
  .prize-card{
    text-align:center; padding:20px 16px; border-radius:12px;
    background:var(--accent-soft); border:2px solid var(--accent);
    animation:prize-in .4s cubic-bezier(.34,1.4,.64,1);
  }
  @keyframes prize-in{ from{ transform:scale(0.86); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .prize-emoji{font-size:2.6rem; line-height:1;}
  .prize-label{font-family:'Zilla Slab'; font-weight:700; font-size:1.25rem; margin:6px 0 2px; color:var(--accent-ink);}
  .prize-kicker{font-size:0.76rem; text-transform:uppercase; letter-spacing:0.12em; color:var(--accent-ink); opacity:0.75; font-weight:700;}
  .spin-note{font-size:0.8rem; color:var(--ink-faint); margin-top:10px;}
  .pending-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 12px; background:var(--surface-2); border:1px solid var(--line); border-radius:9px; margin-top:8px;
  }
  .chip{
    display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px;
    background:var(--accent-soft); color:var(--accent-ink); font-size:0.78rem; font-weight:700;
    max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .prize-grid{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}

  /* ---------- tips ---------- */
  .tips summary{cursor:pointer; font-weight:700; font-family:'Zilla Slab'; font-size:1.02rem; list-style:none; display:flex; align-items:center; gap:8px;}
  .tips summary::-webkit-details-marker{display:none;}
  .tips summary::before{content:"▸"; color:var(--accent); transition:transform .15s ease;}
  .tips[open] summary::before{transform:rotate(90deg);}
  .tip-prompt{
    display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--accent-soft);
    border:1px solid var(--line); border-radius:9px; padding:10px 12px; margin-top:10px; font-size:0.88rem;
  }
  .tip-prompt code{font-family:'Space Mono'; font-size:0.82rem; color:var(--accent-ink);}
  .tips p{color:var(--ink-soft); font-size:0.9rem; margin:10px 0 0;}

  /* ---------- badge ---------- */
  .demo-badge{
    display:inline-flex; align-items:center; gap:6px; font-size:0.74rem; font-weight:700; color:var(--accent-ink);

  <div style="padding:60px 0; text-align:center; color:var(--ink-faint); font-family:'Space Mono';">Opening the ledger…</div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal" id="modalBody"></div>
</div>

<script>
(function(){
  "use strict";

  var DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var CHORE_EMOJI = ['🧹','🍽️','🛏️','🐕','🚮','🧺','🪟','🌱','📚','🧽','🚗','🧦'];
  var KID_EMOJI = ['🧑','🧒','👦','👧','🐣','⭐','🦊','🐼'];
  var ALL_DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  var WEEKDAYS = ['Mon','Tue','Wed','Thu','Fri'];

  // A full week to start from — the idea is you delete what doesn't apply,
  // which is faster than inventing a list from an empty screen.
  var STARTER_CHORES = [
    { title:'Make the bed',        emoji:'🛏️', value:1,    days: ALL_DAYS },
    { title:'Tidy your room',      emoji:'🧦', value:1,    days: ALL_DAYS },
    { title:'Load the dishwasher', emoji:'🍽️', value:1.5,  days: WEEKDAYS },
    { title:'Walk the dog',        emoji:'🐕', value:2,    days: ALL_DAYS },
    { title:'Take out the trash',  emoji:'🚮', value:1.5,  days:['Tue','Fri'] },
    { title:'Put away laundry',    emoji:'🧺', value:1.5,  days:['Wed','Sun'] },
    { title:'Homework, no nagging',emoji:'📚', value:1,    days:['Mon','Tue','Wed','Thu'] },
    { title:'Wipe the bathroom',   emoji:'🧽', value:1.5,  days:['Sat'] },
    { title:'Sweep the kitchen',   emoji:'🧹', value:1.5,  days:['Sat'] },
    { title:'Water the plants',    emoji:'🌱', value:1,    days:['Sun'] }
  ];

  // Jobs with no schedule — done when the situation calls for it, paid each time.
  var STARTER_TASKS = [
    { title:'Empty the dishwasher', emoji:'🍽️', value:1,   weeklyCap:7 },
    { title:'Bring in the cans',    emoji:'🗑️', value:1,   weeklyCap:2 },
    { title:'Help with groceries',  emoji:'🛒', value:1.5, weeklyCap:3 },
    { title:'Feed the dog',         emoji:'🐕', value:0.5, weeklyCap:14 }
  ];

  var db = null;
  var state = {
    kids: [], chores: [], logs: [], config: { pin: '1234', familyName: 'Our Family' },
    bigjobs: [], rewards: [], quests: [], tasks: [], owed: [],
    ready: { kids:false, chores:false, logs:false, config:false, bigjobs:false, rewards:false, quests:false, tasks:false, owed:false },
    selectedKidId: null,
    weekOffset: 0,
    parentUnlocked: false,
    tipsOpen: false,
    spinning: false
  };
  var lastBalances = {};
  var wheelRotation = { job: 0, prize: 0 };

  function pad(n){ return String(n).padStart(2,'0'); }
  function toISO(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  function startOfWeek(d){
    var day = d.getDay();
    var diff = (day === 0 ? -6 : 1 - day);
    var m = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    m.setDate(m.getDate() + diff);
    return m;
  }
  function weekDates(offset){
    var base = startOfWeek(new Date());
    base.setDate(base.getDate() + offset*7);
    var out = [];
    for (var i=0;i<7;i++){ var dd = new Date(base); dd.setDate(base.getDate()+i); out.push(dd); }
    return out;
  }
  function weekLabel(dates){
    var a = dates[0], b = dates[6];
    if (a.getMonth() === b.getMonth()) return MONTHS[a.getMonth()] + ' ' + a.getDate() + '–' + b.getDate();
    return MONTHS[a.getMonth()] + ' ' + a.getDate() + ' – ' + MONTHS[b.getMonth()] + ' ' + b.getDate();
  }
  function fmtDate(iso){
    var p = iso.split('-'); var d = new Date(+p[0], +p[1]-1, +p[2]);
    return MONTHS[d.getMonth()] + ' ' + d.getDate();
  }
  function money(n){
    var neg = n < 0; n = Math.abs(n);
    return (neg?'−':'') + '$' + n.toFixed(2);
  }
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function todayISO(){ return toISO(new Date()); }

  function ready(){
    return state.ready.kids && state.ready.chores && state.ready.logs && state.ready.config &&
           state.ready.bigjobs && state.ready.rewards && state.ready.quests &&
           state.ready.tasks && state.ready.owed;
  }

  /* ---- approval ---- */
  function approvalOn(){ return !!state.config.requireApproval; }
  function isPending(e){ return e.approved === false; }
  function pendingFor(kidId){
    return kidLogs(kidId).filter(isPending)
      .sort(function(a,b){ return (b.ts||0)-(a.ts||0); });
  }
  function allPending(){
    return state.logs.filter(isPending).sort(function(a,b){ return (b.ts||0)-(a.ts||0); });
  }

  /* ---- chore kinds ---- */
  function paidChores(kidId){ return kidChores(kidId).filter(function(c){ return !c.unpaid; }); }
  function dutyChores(kidId){ return kidChores(kidId).filter(function(c){ return !!c.unpaid; }); }
  function openChores(){
    return state.chores.filter(function(c){ return c.kidId === 'open'; })
      .sort(function(a,b){ return (a.createdAt||0)-(b.createdAt||0); });
  }

  /* ---- streaks ---- */
  // A day counts when every paid chore due that day got ticked. Today doesn't
  // break a streak just because the day isn't over yet.
  function choreDueOn(ch, d){
    return (ch.days||[]).indexOf(DOW[(d.getDay()+6)%7]) !== -1;
  }
  function dayComplete(kidId, d){
    var iso = toISO(d);
    var due = paidChores(kidId).filter(function(ch){ return choreDueOn(ch, d); });
    if (!due.length) return null; // nothing due — neither breaks nor extends
    for (var i=0;i<due.length;i++){
      if (!logEntry(choreLogId(kidId, due[i].id, iso))) return false;
    }
    return true;
  }
  function streakFor(kidId){
    var n = 0;
    var d = new Date();
    var todayState = dayComplete(kidId, d);
    if (todayState !== true) d.setDate(d.getDate()-1); // today still in progress
    for (var i=0;i<120;i++){
      var st = dayComplete(kidId, d);
      if (st === false) break;
      if (st === true) n++;
      d.setDate(d.getDate()-1);
    }
    return n;
  }

  /* ---- interest on the Save pot ---- */
  // No server to run a nightly job, so the page settles up whatever days were
  // missed since it was last opened. Each day has its own document id, so two
  // devices opening at once can't pay it twice.
  function accrueInterest(kid){
    var rate = Number(kid.interestRate)||0;
    if (rate <= 0 || !kidSplit(kid).on) return;
    var today = todayISO();
    var cursor = kid.lastInterestISO;
    if (!cursor){
      db.doc('kids/'+kid.id).update({ lastInterestISO: today });
      return;
    }
    if (cursor >= today) return;

    var parts = cursor.split('-');
    var d = new Date(+parts[0], +parts[1]-1, +parts[2]);
    var running = bucketBalance(kid.id, 'save');
    // A tenner at 12% earns a third of a cent a day. Rounding each day to the
    // nearest cent would pay nothing forever, so the fraction is carried and
    // posted once it adds up to a penny — which is what a bank actually does.
    var carry = Number(kid.interestCarry) || 0;
    var daily = rate / 100 / 365;
    var guard = 0;

    while (toISO(d) < today && guard < 400){
      d.setDate(d.getDate()+1);
      guard++;
      var iso = toISO(d);
      carry += (running + carry) * daily;
      if (carry < 0.01) continue;
      var pay = Math.floor(carry * 100) / 100;
      carry = Math.round((carry - pay) * 10000) / 10000;
      var id = kid.id + '_interest_' + iso;
      if (logEntry(id)) continue;
      running += pay;
      db.collection('log').doc(id).set({
        kidId: kid.id, title: 'Interest on savings', amount: pay, type: 'interest',
        dateISO: iso, ts: Date.now(), split: { spend:0, save:pay, invest:0 }
      });
    }
    db.doc('kids/'+kid.id).update({ lastInterestISO: today, interestCarry: carry });
  }

  function kidTasks(kidId){
    return state.tasks.filter(function(t){ return t.kidId === kidId; })
      .sort(function(a,b){ return (a.createdAt||0)-(b.createdAt||0); });
  }
  function taskEntriesThisWeek(kidId, taskId){
    var dates = weekDates(state.weekOffset);
    var from = toISO(dates[0]), to = toISO(dates[6]);
    return kidLogs(kidId).filter(function(l){
      return l.type === 'task' && l.taskId === taskId && l.dateISO >= from && l.dateISO <= to;
    }).sort(function(a,b){ return (b.ts||0)-(a.ts||0); });
  }
  function owedFor(kidId){
    return state.owed.filter(function(o){ return o.kidId === kidId && !o.redeemed; })
      .sort(function(a,b){ return (b.ts||0)-(a.ts||0); });
  }
  function usedCount(kidId){
    return state.owed.filter(function(o){ return o.kidId === kidId && o.redeemed; }).length;
  }

  function questFor(kidId){
    var q = state.quests.find(function(x){ return x.id === kidId; });
    return q || { id: kidId, status: 'idle', lastSpinISO: '' };
  }
  function approvedRewards(){ return state.rewards.filter(function(r){ return r.approved; }); }
  function pendingRewards(){ return state.rewards.filter(function(r){ return !r.approved; }); }
  function canSpinToday(kidId){
    return questFor(kidId).status === 'idle'; // demo: spin freely
  }

  var BUCKETS = ['spend','save','invest'];
  var BUCKET_META = {
    spend:  { label:'Spend',  sub:'spend out of the house' },
    save:   { label:'Save',   sub:'for something big' },
    invest: { label:'Invest', sub:'into the market' }
  };

  function round2(n){ return Math.round(n * 100) / 100; }

  // A kid's split: on by default, even thirds by default, custom percentages if asked for.
  function kidSplit(kid){
    var on = !kid || kid.splitEnabled !== false;
    var mode = (kid && kid.splitMode === 'custom') ? 'custom' : 'even';
    var s = Number(kid && kid.splitSpend), v = Number(kid && kid.splitSave), i = Number(kid && kid.splitInvest);
    if (!isFinite(s) || !isFinite(v) || !isFinite(i) || (s + v + i) <= 0){ s = 34; v = 33; i = 33; }
    var total = s + v + i;
    return { on: on, mode: mode, spend: s/total, save: v/total, invest: i/total, pct: { spend:s, save:v, invest:i } };
  }

  // Three even thirds, to the cent. A dollar doesn't divide by three, so the odd cent
  // rotates between the pots run to run instead of always favoring the same one.
  function evenSplit(amount, rotation){
    var cents = Math.round(amount * 100);
    var sign = cents < 0 ? -1 : 1;
    var abs = Math.abs(cents);
    var base = Math.floor(abs / 3);
    var parts = [base, base, base];
    for (var k = 0; k < abs - base*3; k++){ parts[((rotation||0) + k) % 3] += 1; }
    return { spend: sign*parts[0]/100, save: sign*parts[1]/100, invest: sign*parts[2]/100 };
  }

  function splitRotation(kidId){
    return kidLogs(kidId).filter(function(e){ return !!e.split; }).length % 3;
  }

  // Credits are divided the moment they're earned, so changing the split later
  // never rewrites history.
  function splitAmount(kid, amount){
    var sp = kidSplit(kid);
    if (!sp.on) return null;
    if (sp.mode === 'even') return evenSplit(amount, splitRotation(kid && kid.id));
    var spend = round2(amount * sp.spend);
    var save = round2(amount * sp.save);
    return { spend: spend, save: save, invest: round2(amount - spend - save) };
  }

  function entryBuckets(e){
    if (e.split) return { spend: e.split.spend||0, save: e.split.save||0, invest: e.split.invest||0 };
    var out = { spend:0, save:0, invest:0 };
    var b = (e.bucket && BUCKETS.indexOf(e.bucket) !== -1) ? e.bucket : 'spend';
    out[b] = e.amount || 0;
    return out;
  }

  function bucketBalance(kidId, bucket){
    return kidLogs(kidId).reduce(function(s, e){
      return e.approved === false ? s : s + entryBuckets(e)[bucket];
    }, 0);
  }

  function kidLogs(kidId){ return state.logs.filter(function(l){ return l.kidId === kidId; }); }
  function kidBalance(kidId){
    // money awaiting a parent's nod isn't money yet
    return kidLogs(kidId).reduce(function(sum,l){
      return l.approved === false ? sum : sum + (l.amount||0);
    }, 0);
  }
  function pendingTotal(kidId){
    return pendingFor(kidId).reduce(function(s,l){ return s + (l.amount||0); }, 0);
  }
  function kidChores(kidId){
    return state.chores.filter(function(c){ return c.kidId === kidId; })
      .sort(function(a,b){ return (a.title||'').localeCompare(b.title||''); });
  }
  function logEntry(id){ return state.logs.find(function(l){ return l.id === id; }); }

  function choreLogId(kidId, choreId, iso){ return kidId + '_' + choreId + '_' + iso; }
  function allowanceLogId(kidId, mondayISO){ return kidId + '_allowance_' + mondayISO; }

  /* ---------------- rendering ---------------- */

  function render(){
    if (state.spinning) return; // never redraw the DOM out from under a spinning wheel
    var root = document.getElementById('app');
    if (!db){
      root.innerHTML = noDbView();
      return;
    }
    if (!ready()){
      root.innerHTML = '<div style="padding:60px 0; text-align:center; color:var(--ink-faint); font-family:\'Space Mono\';">Opening the ledger…</div>';
      return;
    }
    if (!state.selectedKidId && state.kids.length){
      state.selectedKidId = state.kids[0].id;
    }
    var kid = state.kids.find(function(k){ return k.id === state.selectedKidId; });

    if (state.displayMode){
      root.innerHTML = displayView();
      return;
    }

    var html = '';
    html += topbar();
    html += kidTabs();
    html += '<main>';
    if (state.kids.length === 0){
      html += emptyStateCard();
    } else if (kid) {
      html += paystub(kid);
      html += approvalSection();
      html += punchcard(kid);
      html += taskSection(kid);
      html += wheelSection(kid);
      html += owedSection(kid);
      html += leaderboard();
      html += ledgerLog(kid);
    }
    if (state.parentUnlocked) html += managePanel();
    html += tipsPanel();
    html += '</main>';
    html += '<footer>Earn It · demo sandbox · the real one saves everything and shares it with the family</footer>';
    root.innerHTML = html;

    // settle up any interest owed since the app was last opened (once per load)
    if (!state.interestSettled && state.kids.length){
      state.interestSettled = true;
      state.kids.forEach(accrueInterest);
    }

    if (kid) redrawWheel();
    if (state.openModal === 'wheel' && !document.getElementById('overlay').hidden) modalManageWheel();

    // shower the prize once, the first time a given win is shown
    if (kid){
      var rq = questFor(kid.id);
      if (rq.status === 'revealed'){
        var key = kid.id + ':' + (rq.spunAt || '') + ':' + (rq.rewardId || rq.rewardLabel || '');
        if (key !== lastRevealKey){
          lastRevealKey = key;
          setTimeout(fxPrizeShower, 120);
        }
      }
    }

    // balance bump animation
    if (kid){
      var bal = kidBalance(kid.id);
      var elBal = document.querySelector('.balance-num');
      if (elBal && lastBalances[kid.id] !== undefined && lastBalances[kid.id] !== bal){
        elBal.classList.add('bump');
        setTimeout(function(){ elBal.classList.remove('bump'); }, 260);
      }
      lastBalances[kid.id] = bal;
    }
  }

  /* ---------------- kitchen display ---------------- */
  // Big, read-only, meant for a tablet propped on the counter.

  function displayView(){
    var today = new Date();
    var iso = toISO(today);
    var dow = DOW[(today.getDay()+6)%7];

    var html = '<div class="display">' +
      '<div class="display-top">' +
        '<div><h1>' + esc(state.config.familyName || 'Our Family') + '</h1>' +
        '<div class="display-date">' + dow + ', ' + MONTHS[today.getMonth()] + ' ' + today.getDate() + '</div></div>' +
        '<button class="pill-btn" data-action="exit-display">Exit</button>' +
      '</div><div class="display-grid">';

    state.kids.forEach(function(k){
      var due = paidChores(k.id).concat(dutyChores(k.id)).filter(function(ch){ return choreDueOn(ch, today); });
      var left = due.filter(function(ch){ return !logEntry(choreLogId(k.id, ch.id, iso)); });
      var streak = streakFor(k.id);
      var owed = owedFor(k.id);

      html += '<div class="display-card">' +
        '<div class="display-name">' + esc(k.emoji||'🧒') + ' ' + esc(k.name) + '</div>' +
        '<div class="display-bal">' + money(kidBalance(k.id)) + '</div>' +
        (streak ? '<div class="display-streak">🔥 ' + streak + ' day streak</div>' : '') +
        '<div class="display-left">' +
          (left.length
            ? '<div class="display-left-h">Still to do today</div>' +
              left.map(function(ch){ return '<div class="display-chore">' + esc(ch.emoji||'⭐') + ' ' + esc(ch.title) + '</div>'; }).join('')
            : '<div class="display-done">✓ All done today</div>') +
        '</div>' +
        (owed.length ? '<div class="display-owed">🎁 owed: ' + esc(owed[0].label) +
          (owed.length>1 ? ' +' + (owed.length-1) + ' more' : '') + '</div>' : '') +
      '</div>';
    });

    html += '</div></div>';
    return html;
  }

  function noDbView(){
    return '<div style="padding:70px 0; text-align:center;">' +
      '<h2 style="margin-bottom:10px;">Earn It needs its live page</h2>' +
      '<p style="color:var(--ink-soft); max-width:38ch; margin:0 auto;">This ledger saves everyone’s chores and balances live. Open it from its published claude.ai link to use it.</p>' +
      '</div>';
  }

  function topbar(){
    return '' +
      '<header class="topbar">' +
        '<div class="brand">' +
          '<div class="brand-mark">✦</div>' +
          '<div><h1>Earn It</h1><small>' + esc(state.config.familyName || 'Our Family') + '’s chore ledger</small></div>' +
        '</div>' +
        '<div class="topbar-actions">' +
          '<button class="pill-btn" data-action="enter-display" title="Kitchen display">🖥</button>' +
          '<button class="pill-btn" data-action="week-prev">‹</button>' +
          '<span class="pill-btn" style="cursor:default;">' + weekLabel(weekDates(state.weekOffset)) + (state.weekOffset===0?'':' ') + '</span>' +
          '<button class="pill-btn" data-action="week-next">›</button>' +
          '<button class="pill-btn ' + (state.parentUnlocked?'on':'') + '" data-action="toggle-parent">' + (state.parentUnlocked ? '🔓 Parent Mode' : '🔒 Parent Mode') + '</button>' +
        '</div>' +
      '</header>';
  }

  function kidTabs(){
    var html = '<nav class="kidtabs">';
    state.kids.forEach(function(k){
      html += '<button class="tab ' + (k.id===state.selectedKidId?'active':'') + '" data-action="select-kid" data-id="' + k.id + '">' +
        '<span class="tab-emoji">' + esc(k.emoji||'🧒') + '</span>' + esc(k.name) + '</button>';
    });
    if (state.parentUnlocked){

  /* ---------------- sparkles ---------------- */

  var fx = { canvas:null, ctx:null, parts:[], running:false, dpr:1 };
  var lastRevealKey = null;

  function fxReady(){
    if (prefersReducedMotion()) return false;
    if (fx.canvas) return true;
    var c = document.createElement('canvas');
    c.id = 'fx';
    c.setAttribute('aria-hidden', 'true');
    document.body.appendChild(c);
    fx.canvas = c;
    fx.ctx = c.getContext('2d');
    fxResize();
    window.addEventListener('resize', fxResize);
    return true;
  }

  function fxResize(){
    if (!fx.canvas) return;
    fx.dpr = window.devicePixelRatio || 1;
    fx.canvas.width = Math.round(window.innerWidth * fx.dpr);
    fx.canvas.height = Math.round(window.innerHeight * fx.dpr);
    fx.canvas.style.width = window.innerWidth + 'px';
    fx.canvas.style.height = window.innerHeight + 'px';
  }

  function sparkleColors(){
    var cs = getComputedStyle(document.documentElement);
    return [
      cs.getPropertyValue('--accent').trim() || '#bf7326',
      cs.getPropertyValue('--pine').trim() || '#2f6a3d',
      '#ffd98a',
      '#ffffff'
    ];
  }

  function starPath(ctx, r, points){
    var step = Math.PI / points;
    ctx.beginPath();
    for (var i = 0; i < points*2; i++){
      var rad = (i % 2 === 0) ? r : r * 0.34;
      var a = i * step - Math.PI/2;
      ctx[i === 0 ? 'moveTo' : 'lineTo'](Math.cos(a)*rad, Math.sin(a)*rad);
    }
    ctx.closePath();
  }

  function fxEmit(x, y, count, opts){
    if (!fxReady()) return;
    opts = opts || {};
    var colors = sparkleColors();
    var spread = opts.spread === undefined ? Math.PI*2 : opts.spread;
    var dir = opts.dir === undefined ? -Math.PI/2 : opts.dir;
    var speed = opts.speed || 3;
    for (var i = 0; i < count; i++){
      if (fx.parts.length > 300) break;
      var a = dir + (Math.random() - 0.5) * spread;
      var v = speed * (0.45 + Math.random()*0.9);
      fx.parts.push({
        x:x, y:y,
        vx: Math.cos(a)*v, vy: Math.sin(a)*v,
        life: 1, decay: 0.012 + Math.random()*0.016,
        size: (opts.size || 7) * (0.5 + Math.random()*0.9),
        rot: Math.random()*Math.PI, spin: (Math.random()-0.5)*0.3,
        grav: opts.grav === undefined ? 0.07 : opts.grav,
        color: colors[(Math.random()*colors.length)|0]
      });
    }
    if (!fx.running && fx.ctx){ fx.running = true; requestAnimationFrame(fxFrame); }
  }

  function fxFrame(){
    var ctx = fx.ctx;
    if (!ctx){ fx.running = false; return; }
    ctx.setTransform(fx.dpr, 0, 0, fx.dpr, 0, 0);
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    var alive = 0;
    for (var i = 0; i < fx.parts.length; i++){
      var p = fx.parts[i];
      if (p.life <= 0) continue;
      p.x += p.vx; p.y += p.vy;
      p.vy += p.grav; p.vx *= 0.985; p.vy *= 0.985;
      p.rot += p.spin;
      p.life -= p.decay;
      if (p.life <= 0) continue;
      alive++;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      ctx.fillStyle = p.color;
      starPath(ctx, p.size * (0.35 + p.life*0.65), 4);
      ctx.fill();
      ctx.restore();
    }
    if (alive === 0){
      fx.parts.length = 0;
      fx.running = false;
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      return;
    }
    if (fx.parts.length > 400){
      fx.parts = fx.parts.filter(function(p){ return p.life > 0; });
    }
    requestAnimationFrame(fxFrame);
  }

  // The pointer sits at the top of the wheel — that's where sparks come off.
  function wheelPointerPoint(){
    var c = document.getElementById('wheelCanvas');
    if (!c) return null;
    var r = c.getBoundingClientRect();
    if (!r.width) return null;
    return { x: r.left + r.width/2, y: r.top + 8 };
  }

  function fxPrizeShower(){
    if (!fxReady()) return;
    var card = document.querySelector('.prize-card');
    if (!card) return;
    var r = card.getBoundingClientRect();
    // burst from the corners so the sparkles frame the prize instead of covering it
    fxEmit(r.left + 6, r.top + 10, 16, { dir: -2.4, spread: 1.5, speed: 5.2, size: 10, grav: 0.1 });
    fxEmit(r.right - 6, r.top + 10, 16, { dir: -0.75, spread: 1.5, speed: 5.2, size: 10, grav: 0.1 });
    fxEmit(r.left + 6, r.bottom - 10, 8, { dir: 2.5, spread: 1.2, speed: 3.6, size: 8, grav: 0.1 });
    fxEmit(r.right - 6, r.bottom - 10, 8, { dir: 0.65, spread: 1.2, speed: 3.6, size: 8, grav: 0.1 });
    for (var i = 0; i < 24; i++){
      (function(n){
        setTimeout(function(){
          var box = document.querySelector('.prize-card');
          if (!box) return;
          var b = box.getBoundingClientRect();
          fxEmit(b.left + Math.random()*b.width, b.top - 12, 1,
                 { dir: Math.PI/2, spread: 0.9, speed: 1.5, size: 8, grav: 0.09 });
        }, n * 45);
      })(i);
    }
  }

  function wheelItemsFor(kind){
    if (kind === 'prize'){
      return approvedRewards().map(function(r){
        return { label: r.label, emoji: r.emoji||'🎁', id: r.id,
                 weight: (Number(r.weight) > 0 ? Number(r.weight) : 1), jackpot: !!r.jackpot };
      });

    return state.bigjobs.map(function(j){
      return { label: j.title, emoji: j.emoji||'🧽', id: j.id, weight: 1 };
    });

  // Slices are sized by weight, so a rare prize looks rare — the odds you can
  // see on the wheel are the odds you actually get.
  function sliceAngles(items){
    var total = items.reduce(function(s,i){ return s + (i.weight||1); }, 0);
    var out = [], acc = 0;
    items.forEach(function(i){
      var span = (Math.PI*2) * ((i.weight||1) / total);
      out.push({ start: acc, span: span, mid: acc + span/2 });
      acc += span;
    });
    return out;
  }

  function pickWeighted(items){
    var total = items.reduce(function(s,i){ return s + (i.weight||1); }, 0);
    var r = Math.random() * total, acc = 0;
    for (var i=0;i<items.length;i++){
      acc += (items[i].weight||1);
      if (r <= acc) return i;
    }
    return items.length - 1;
  }

  function wheelColors(){
    var cs = getComputedStyle(document.documentElement);
    var out = [];
    for (var i=1; i<=6; i++){
      var v = cs.getPropertyValue('--wheel-' + i).trim();
      if (v) out.push(v);
    }
    return out.length ? out : ['#2f6a3d','#bf7326','#a8402a','#5b7f4b','#2c6a67','#7a5288'];
  }

  function drawWheel(canvas, items, rotation){
    if (!canvas || !items.length) return;
    var size = canvas.clientWidth || 280;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);

    var colors = wheelColors();
    var cx = size/2, cy = size/2, r = size/2 - 4;
    var angles = sliceAngles(items);

    var hubR = Math.max(20, r * 0.17);
    var fontSize = items.length > 8 ? 10.5 : 12;
    var emojiSize = fontSize + 5;
    var maxWidth = r - 28 - hubR - emojiSize; // rim to hub, minus the emoji that leads the label

    items.forEach(function(item, i){
      var start = rotation + angles[i].start;
      var span = angles[i].span;
      var colorIdx = i % colors.length;
      // don't let the palette wrap around into its own first color at the seam
      if (i === items.length - 1 && items.length > 2 && (items.length % colors.length) === 1) colorIdx = 1;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, start, start + span);
      ctx.closePath();
      ctx.fillStyle = item.jackpot ? '#c9a227' : colors[colorIdx];
      ctx.fill();
      ctx.strokeStyle = item.jackpot ? '#fff3c4' : 'rgba(255,255,255,0.55)';
      ctx.lineWidth = item.jackpot ? 2.5 : 1.5;
      ctx.stroke();

      // label — flipped on the left half so it never reads upside down
      var mid = start + span/2;
      var norm = ((mid % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
      var flip = (norm > Math.PI/2 && norm < Math.PI*1.5);

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(mid);
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffffff';

      var edge = r - 14;
      var label = item.label;
      ctx.font = '700 ' + fontSize + 'px Karla, system-ui, sans-serif';
      while (ctx.measureText(label).width > maxWidth && label.length > 5){
        label = label.slice(0, -1);
      }
      if (label !== item.label) label = label.replace(/[\s,.]+$/, '') + '…';

      // a sliver too thin to hold words gets the emoji alone
      var tooThin = span < 0.2;

      if (flip){
        ctx.translate(edge, 0);
        ctx.rotate(Math.PI);
        ctx.textAlign = 'left';
        ctx.font = emojiSize + 'px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
        ctx.fillText(item.emoji, 0, 0);
        if (!tooThin){
          ctx.font = '700 ' + fontSize + 'px Karla, system-ui, sans-serif';
          ctx.fillText(label, emojiSize + 6, 1);
        }
      } else {
        ctx.textAlign = 'right';
        ctx.font = emojiSize + 'px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
        ctx.fillText(item.emoji, edge, 0);
        if (!tooThin){
          ctx.font = '700 ' + fontSize + 'px Karla, system-ui, sans-serif';
          ctx.fillText(label, edge - emojiSize - 6, 1);
        }
      }
      ctx.restore();
    });

    // hub
    var cs = getComputedStyle(document.documentElement);
    ctx.beginPath();
    ctx.arc(cx, cy, hubR, 0, Math.PI*2);
    ctx.fillStyle = (cs.getPropertyValue('--surface').trim() || '#fff');
    ctx.fill();
    ctx.strokeStyle = (cs.getPropertyValue('--line-strong').trim() || '#b9c2a6');
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = (cs.getPropertyValue('--accent').trim() || '#bf7326');
    ctx.font = '700 15px "Zilla Slab", Georgia, serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('✦', cx, cy + 1);
  }

  function redrawWheel(){
    var canvas = document.getElementById('wheelCanvas');
    if (!canvas) return;
    var kind = canvas.dataset.kind;
    drawWheel(canvas, wheelItemsFor(kind), wheelRotation[kind] || 0);
  }

  function prefersReducedMotion(){
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function spinTo(kind, targetIndex, done){
    var canvas = document.getElementById('wheelCanvas');
    var items = wheelItemsFor(kind);
    if (!canvas || !items.length){ done(); return; }

    var centerAngle = sliceAngles(items)[targetIndex].mid;
    var from = wheelRotation[kind] || 0;
    var turns = 4 + Math.random() * 2;
    // land the chosen slice under the pointer at the top (-90deg)
    var target = (-Math.PI/2) - centerAngle + (Math.PI * 2 * Math.ceil(turns + from/(Math.PI*2)));
    while (target < from + Math.PI * 6) target += Math.PI * 2;

    if (prefersReducedMotion()){
      wheelRotation[kind] = target;
      drawWheel(canvas, items, target);
      setTimeout(done, 150);
      return;
    }

    var duration = 4200;
    var startTime = null;
    state.spinning = true;

    function frame(now){
      if (startTime === null) startTime = now;
      var t = Math.min(1, (now - startTime) / duration);
      var eased = 1 - Math.pow(1 - t, 4);
      var current = from + (target - from) * eased;
      wheelRotation[kind] = current;
      drawWheel(canvas, items, current);

      // sparks fly off the pointer, thinning out as the wheel slows
      var pt = wheelPointerPoint();
      if (pt && Math.random() < Math.pow(1 - t, 2) * 0.95){
        fxEmit(pt.x, pt.y + 8, 2, { dir: -0.3, spread: 1.1, speed: 2.6, size: 6, grav: 0.13 });
      }

      if (t < 1){
        requestAnimationFrame(frame);
      } else {
        state.spinning = false;
        if (pt){
          fxEmit(pt.x, pt.y + 8, 28,
                 { dir: -Math.PI/2, spread: Math.PI*1.15, speed: 4.6, size: 9, grav: 0.14 });
        }
        done();
      }
    }
    requestAnimationFrame(frame);
  }

  function spinJobWheel(kid){
    var items = wheelItemsFor('job');
    if (!items.length) return;
    var idx = pickWeighted(items);
    spinTo('job', idx, function(){
      var picked = items[idx];
      db.doc('quests/' + kid.id).set({
        kidId: kid.id, status: 'active',
        jobId: picked.id, jobTitle: picked.label, jobEmoji: picked.emoji,
        dateISO: todayISO(), lastSpinISO: todayISO(), spunAt: Date.now()
      })['catch'](function(){ render(); });
    });
  }

    var idx = pickWeighted(items);

      var picked = items[idx];
      db.doc('quests/' + kid.id).set({
        kidId: kid.id, status: 'revealed',

  function wirePctSum(){
    var form = document.querySelector('#modalBody form[data-form="kid"]');
    if (!form) return;
    var row = document.getElementById('pctRow');
    var sumEl = document.getElementById('pctSum');
    var modeEl = document.getElementById('splitMode');

    function update(){
      var custom = modeEl.value === 'custom';
      if (row) row.hidden = !custom;
      if (!sumEl) return;
      if (!custom){
        sumEl.textContent = 'Each pot gets an equal third of every dollar.';
        sumEl.className = 'pct-sum';
        return;
      }
      var sum = ['splitSpend','splitSave','splitInvest'].reduce(function(s,n){
        return s + (parseFloat(form.elements[n].value) || 0);
      }, 0);
      sumEl.textContent = sum === 100 ? 'Adds up to 100% ✓' : 'Adds up to ' + sum + '% — needs to be 100%';
      sumEl.className = 'pct-sum' + (sum === 100 ? '' : ' bad');
    }
    ['splitSpend','splitSave','splitInvest'].forEach(function(n){
      form.elements[n].addEventListener('input', update);
    });
    if (modeEl) modeEl.addEventListener('change', update);
    update();
  }

  function toggleChore(kidId, choreId, iso, choreTitle, value){
    var id = choreLogId(kidId, choreId, iso);
    var existing = logEntry(id);
    if (existing){
      return db.doc('log/'+id).delete();
    }
    var kid = state.kids.find(function(k){ return k.id === kidId; });
    var chore = state.chores.find(function(c){ return c.id === choreId; });
    var unpaid = chore && chore.unpaid;
    var amount = unpaid ? 0 : value;
    var entry = {
      kidId: kidId, choreId: choreId, title: choreTitle, amount: amount,
      type: unpaid ? 'duty' : 'chore', dateISO: iso, ts: Date.now()
    };
    if (!unpaid){
      var split = splitAmount(kid, amount);
      if (split) entry.split = split;
      if (approvalOn()) entry.approved = false;
    }
    if (chore && chore.kidId === 'open') entry.claimed = true;
    return db.doc('log/'+id).set(entry);
  }
  function addAllowance(kid){
    var mondayISO = toISO(startOfWeek(new Date()));
    var id = allowanceLogId(kid.id, mondayISO);
    var entry = {
      kidId: kid.id, title: 'Weekly allowance', amount: kid.baseAllowance, type: 'allowance',
      dateISO: todayISO(), ts: Date.now()
    };
    var split = splitAmount(kid, kid.baseAllowance);
    if (split) entry.split = split;
    return db.doc('log/'+id).set(entry);
  }
  function addMoneyEntry(kind, kidId, amount, note, bucket){
    var sign = kind==='bonus' ? 1 : -1;
    var titleFallback = kind==='bonus' ? 'Bonus' : (kind==='deduction' ? 'Deduction' : 'Payout');
    var kid = state.kids.find(function(k){ return k.id === kidId; });
    var signed = sign * Math.abs(amount);
    var entry = {
      kidId: kidId, title: note ? note : titleFallback, amount: signed, type: kind,
      dateISO: todayISO(), ts: Date.now()
    };
    if (kind === 'bonus'){
      var split = splitAmount(kid, signed);
      if (split) entry.split = split;
    } else if (kidSplit(kid).on){
      entry.bucket = (BUCKETS.indexOf(bucket) !== -1) ? bucket : 'spend';
    }
    return db.collection('log').add(entry);
  }

  /* ---------------- events ---------------- */

  function confirmTwice(btn, action){
    if (btn.dataset.confirm !== '1'){
      btn.dataset.confirm = '1';
      var original = btn.innerHTML;
      btn.dataset.original = original;
      btn.innerHTML = '❓';
      btn.title = 'Click again to confirm';
      setTimeout(function(){
        if (btn.dataset.confirm === '1'){
          btn.dataset.confirm = '0';
          btn.innerHTML = btn.dataset.original || original;
        }
      }, 3500);
      return false;
    }
    action();
    return true;
  }

  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-action]');
    if (!t) return;
    var action = t.dataset.action;

    if (action === 'week-prev'){ state.weekOffset--; render(); return; }
    if (action === 'week-next'){ state.weekOffset++; render(); return; }
    if (action === 'select-kid'){ state.selectedKidId = t.dataset.id; render(); return; }
    if (action === 'toggle-tips'){ return; } // native <details>

    if (action === 'toggle-parent'){
      if (state.parentUnlocked){ state.parentUnlocked = false; render(); }
      else { modalPin(); }
      return;
    }
    if (action === 'close-modal'){ closeModal(); return; }

    if (action === 'toggle-chore'){
      if (!state.parentUnlocked) {
        // kids can check off their own chores without unlocking parent mode
      }
      var kid = state.kids.find(function(k){return k.id===t.dataset.kid;});
      var ch = state.chores.find(function(c){return c.id===t.dataset.chore;});
      if (kid && ch) toggleChore(kid.id, ch.id, t.dataset.date, ch.title, ch.value);
      return;
    }

    if (action === 'open-add-kid'){ modalKidForm(null); return; }
    if (action === 'open-edit-kid'){
      var k = state.kids.find(function(x){return x.id===t.dataset.id;});
      modalKidForm(k); return;
    }
    if (action === 'delete-kid'){
      confirmTwice(t, function(){ db.doc('kids/'+t.dataset.id).delete(); });
      return;
    }

    if (action === 'open-add-chore'){ modalChoreForm(t.dataset.kid, null); return; }
    if (action === 'open-edit-chore'){
      var ch2 = state.chores.find(function(x){return x.id===t.dataset.id;});
      modalChoreForm(ch2.kidId, ch2); return;
    }
    if (action === 'delete-chore'){
      confirmTwice(t, function(){ db.doc('chores/'+t.dataset.id).delete(); });
      return;
    }
    if (action === 'delete-log'){
      confirmTwice(t, function(){ db.doc('log/'+t.dataset.id).delete(); });
      return;

  /* ---------------- demo store (in memory, resets on reload) ---------------- */

  function makeMemoryDb(seed){
    var store = JSON.parse(JSON.stringify(seed));
    var listeners = [];

    function ensure(col){ if (!store[col]) store[col] = {}; }
    function meta(){ return { fromCache:false, hasPendingWrites:false }; }

    function colSnap(col){
      var docs = Object.keys(store[col] || {}).map(function(id){
        var body = store[col][id];
        return { id:id, exists:true, data:function(){ return body; }, metadata:meta() };
      });
      return { docs:docs, size:docs.length, empty:!docs.length, docChanges:function(){ return []; }, metadata:meta() };
    }
    function docSnap(col, id){
      var body = (store[col] || {})[id];
      return { id:id, exists:!!body, data:function(){ return body; }, metadata:meta() };
    }
    function notify(){
      setTimeout(function(){
        listeners.forEach(function(l){
          l.cb(l.type === 'col' ? colSnap(l.col) : docSnap(l.col, l.id));
        });
      }, 0);
    }

    function docRef(col, id){
      return {
        id: id,
        path: col + '/' + id,
        get: function(){ return Promise.resolve(docSnap(col, id)); },
        set: function(data){
          ensure(col); store[col][id] = JSON.parse(JSON.stringify(data)); notify();
          return Promise.resolve();
        },
        update: function(data){
          ensure(col);
          if (!store[col][id]) return Promise.reject({ code:'invalid_argument', message:'no such document' });
          Object.assign(store[col][id], JSON.parse(JSON.stringify(data))); notify();
          return Promise.resolve();
        },
        'delete': function(){
          if (store[col]) delete store[col][id];
          notify();
          return Promise.resolve();
        },
        onSnapshot: function(cb){
          listeners.push({ type:'doc', col:col, id:id, cb:cb });
          setTimeout(function(){ cb(docSnap(col, id)); }, 0);
          return function(){};
        },
        collection: function(){ return null; }
      };
    }

    return {
      doc: function(path){
        var parts = path.split('/');
        return docRef(parts[0], parts.slice(1).join('/'));
      },
      collection: function(path){
        return {
          path: path,
          doc: function(id){ return docRef(path, id); },
          add: function(data){
            ensure(path);
            var id = 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
            store[path][id] = JSON.parse(JSON.stringify(data));
            notify();
            return Promise.resolve(docRef(path, id));
          },
          onSnapshot: function(cb){
            listeners.push({ type:'col', col:path, cb:cb });
            setTimeout(function(){ cb(colSnap(path)); }, 0);
            return function(){};
          }
        };
      }
    };
  }
