<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><title>Earn It • Multi-Kid Chore Tracker</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap"><style>:root{--bg:#fef8f6;--surface:#ffffff;--surface-2:#fef3f0;--ink:#1f1f1f;--ink-soft:#6b7280;--ink-faint:#9ca3af;--line:#f0e5e1;--line-strong:#e8d4cf;--accent:#FF5E78;--accent-soft:#ffe8ed;--pine:#6BCFB8;--pine-soft:#e1f8f5;--rust:#FF5E78;--rust-soft:#ffe8ed;--shadow:0 1px 0 rgba(31,31,31,0.05),0 8px 20px -12px rgba(31,31,31,0.15);--radius:14px;}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a0e0c;--surface:#2d1a17;--surface-2:#251410;--ink:#f5f5f5;--ink-soft:#d1d5db;--ink-faint:#9ca3af;--line:#4a2620;--line-strong:#6b3a2f;--accent:#FF7A94;--accent-soft:#3d1721;--pine:#7fdfcc;--pine-soft:#1a3a35;--rust:#FF7A94;--rust-soft:#3d1721;--shadow:0 1px 0 rgba(0,0,0,0.3),0 8px 24px -12px rgba(0,0,0,0.5);}}*{box-sizing:border-box;}html{-webkit-text-size-adjust:100%;}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,'Segoe UI',system-ui,sans-serif;padding:0 16px 80px;line-height:1.45;}h1,h2,h3{font-family:Outfit,system-ui,sans-serif;text-wrap:balance;margin:0;font-weight:700;}.wrap{max-width:760px;margin:0 auto;}button{font-family:inherit;cursor:pointer;}input,select,textarea{font-family:inherit;}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0 14px;border-bottom:3px double var(--line-strong);flex-wrap:wrap;}.brand{display:flex;align-items:center;gap:10px;}.brand-mark{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:Outfit;font-weight:800;font-size:1.15rem;flex:none;}.brand h1{font-size:1.5rem;font-weight:700;}.brand small{font-size:0.72rem;text-transform:uppercase;color:var(--ink-faint);font-weight:600;}.kid-tabs{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px;}.kid-tab{flex:none;display:flex;align-items:center;gap:8px;padding:9px 16px;background:var(--surface-2);border:1px solid var(--line);border-bottom:3px solid var(--line);border-radius:10px 10px 4px 4px;font-weight:700;cursor:pointer;}.kid-tab.active{background:var(--surface);border-bottom-color:var(--accent);color:var(--ink);}.kid-tab .remove-kid{margin-left:6px;font-size:0.9rem;cursor:pointer;color:var(--rust);}.setup-screen{display:flex;flex-direction:column;gap:20px;text-align:center;}.setup-section{display:flex;flex-direction:column;gap:12px;}.age-picker{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px;}.age-option{padding:8px 16px;border:2px solid var(--line-strong);border-radius:8px;background:var(--surface-2);font-weight:600;cursor:pointer;transition:all .2s;}.age-option:hover{border-color:var(--accent);}.age-option.selected{background:var(--accent);color:#fff;border-color:var(--accent);}.add-kid-btn{background:var(--pine);color:#fff;border:none;padding:10px 20px;border-radius:8px;font-weight:700;cursor:pointer;width:100%;margin-top:12px;}.add-kid-btn:active{transform:scale(0.96);}main{padding-top:18px;display:flex;flex-direction:column;gap:18px;}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;}.card-head h2{font-size:1.05rem;}.balance-large{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:clamp(2rem,9vw,2.8rem);color:var(--pine);line-height:1;}.label-small{font-size:0.72rem;text-transform:uppercase;color:var(--ink-faint);font-weight:700;}.wheel-container{display:flex;gap:22px;align-items:center;flex-wrap:wrap;}.wheel-canvas{position:relative;width:min(280px,75vw);flex:none;margin:0 auto;}.wheel-canvas canvas{display:block;width:100%;aspect-ratio:1/1;border-radius:50%;}.wheel-pointer{position:absolute;top:-4px;left:50%;transform:translateX(-50%);z-index:2;width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:20px solid var(--ink);filter:drop-shadow(0 1px 1px rgba(0,0,0,0.25));}.wheel-info{flex:1;min-width:200px;}.task-display{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;background:var(--surface-2);border:1px dashed var(--line-strong);margin:12px 0;}.task-emoji{font-size:1.9rem;flex:none;}.task-title{font-family:Outfit;font-weight:700;font-size:1.05rem;}.task-points{font-size:0.85rem;color:var(--ink-soft);}.spin-btn{background:var(--accent);border:none;color:#fff;padding:12px 24px;border-radius:10px;font-weight:700;font-size:1rem;cursor:pointer;display:block;width:100%;}.spin-btn:active{transform:scale(0.96);}.spin-btn[disabled]{opacity:0.5;cursor:not-allowed;}.reward-bank{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:12px;}.reward-card{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;}.reward-emoji{font-size:1.8rem;margin-bottom:6px;}.reward-name{font-family:Outfit;font-weight:700;font-size:0.95rem;margin-bottom:4px;}.reward-cost{font-family:'IBM Plex Mono';font-size:0.8rem;color:var(--ink-soft);}.reward-btn{background:var(--pine);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:0.8rem;font-weight:700;cursor:pointer;width:100%;margin-top:8px;}.reward-btn[disabled]{opacity:0.5;}.approval-queue{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:12px;margin:12px 0;}.approval-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:0.9rem;}.approval-item:last-child{border-bottom:none;}.approval-btns{display:flex;gap:6px;}.btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:8px 12px;border-radius:8px;font-weight:600;font-size:0.8rem;cursor:pointer;}.btn.approve{background:var(--pine);color:#fff;border-color:var(--pine);}.btn.reject{background:var(--rust);color:#fff;border-color:var(--rust);}.btn.edit{background:var(--accent);color:#fff;border-color:var(--accent);margin-top:12px;}.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:999;align-items:center;justify-content:center;}.modal.open{display:flex;}.modal-content{background:var(--surface);border-radius:var(--radius);padding:24px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto;}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}.modal-close{background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--ink-faint);}.item-list{display:flex;flex-direction:column;gap:12px;margin-bottom:16px;}.item-row{display:flex;align-items:center;gap:8px;padding:12px;background:var(--surface-2);border-radius:8px;}.item-row input{flex:1;padding:8px;border:1px solid var(--line);border-radius:6px;font-size:0.9rem;}.item-row .remove-btn{background:var(--rust);color:#fff;border:none;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:0.8rem;}.add-item-section{display:flex;flex-direction:column;gap:8px;}.add-item-section input{padding:10px;border:1px solid var(--line);border-radius:8px;font-size:0.9rem;}.cooldown-bar{height:8px;border-radius:4px;background:var(--line);margin:10px 0;}.cooldown-fill{display:block;height:100%;background:var(--accent);border-radius:4px;}.footer{text-align:center;color:var(--ink-faint);font-size:0.78rem;padding:28px 0 0;}</style></head><body><div class="wrap" id="app"><div class="topbar"><div class="brand"><div class="brand-mark">✨</div><div><h1>Earn It</h1><small>Multi-Kid Edition</small></div></div></div><div id="setupView" class="setup-screen"><h2>Let's set up your family!</h2><div id="kidsSetupContainer"></div><button class="add-kid-btn" onclick="addKidSetup()">+ Add Another Kid</button><button class="spin-btn" onclick="startApp()" style="margin-top:20px;">Start Tracking 🚀</button></div><div id="mainView" hidden><div class="kid-tabs" id="kidTabs"></div><main id="mainContent"></main></div></div><div id="taskModal" class="modal"><div class="modal-content"><div class="modal-head"><h2>Edit Tasks</h2><button class="modal-close" onclick="closeTaskModal()">✕</button></div><div id="taskList" class="item-list"></div><div class="add-item-section"><input type="text" id="newTaskTitle" placeholder="Task name (e.g., Clean room)"><input type="text" id="newTaskEmoji" placeholder="Emoji (e.g., 🧹)" maxlength="2"><input type="number" id="newTaskPoints" placeholder="Points" min="1" max="100"><button class="spin-btn" onclick="addTask()">Add Task</button></div></div></div><div id="rewardModal" class="modal"><div class="modal-content"><div class="modal-head"><h2>Edit Rewards</h2><button class="modal-close" onclick="closeRewardModal()">✕</button></div><div id="rewardList" class="item-list"></div><div class="add-item-section"><input type="text" id="newRewardTitle" placeholder="Reward name (e.g., Ice cream)"><input type="text" id="newRewardEmoji" placeholder="Emoji (e.g., 🍦)" maxlength="2"><input type="number" id="newRewardCost" placeholder="Cost" min="1" max="999"><button class="spin-btn" onclick="addReward()">Add Reward</button></div></div></div><footer class="footer">Earn It • Multi-Kid Chore & Allowance Tracker • Data saved locally 💾</footer><script>"use strict";const KID_EMOJIS=['🧒','👦','👧','🐣','⭐','🦊','🐼','🎨'];let state={kids:[],tasks:{},rewards:{},approvals:{},balance:{},quest:{},setupComplete:false};let editingKidId=null;function $(id){return document.getElementById(id);}function saveState(){localStorage.setItem('earnItState',JSON.stringify(state));}function loadState(){const saved=localStorage.getItem('earnItState');if(saved){state=JSON.parse(saved);renderApp();}}function addKidSetup(){const container=$('kidsSetupContainer');const kidNum=container.children.length+1;const kidId='kid'+kidNum;const div=document.createElement('div');div.className='setup-section';div.innerHTML=`<div><h3>Kid ${kidNum}</h3><input type="text" placeholder="Name" class="kid-name-input" style="padding:10px;border:1px solid var(--line-strong);border-radius:8px;width:100%;max-width:200px;margin:8px auto 0;display:block;"><div style="margin-top:8px;">Age:</div><div class="age-picker kid-age-picker"><div class="age-option" onclick="selectAge(this)">6</div><div class="age-option" onclick="selectAge(this)">7</div><div class="age-option" onclick="selectAge(this)">8</div><div class="age-option" onclick="selectAge(this)">9</div><div class="age-option" onclick="selectAge(this)">10</div><div class="age-option" onclick="selectAge(this)">11</div><div class="age-option" onclick="selectAge(this)">12</div><div class="age-option" onclick="selectAge(this)">13</div><div class="age-option" onclick="selectAge(this)">14</div><div class="age-option" onclick="selectAge(this)">15</div><div class="age-option" onclick="selectAge(this)">16</div><div class="age-option" onclick="selectAge(this)">17</div><div class="age-option" onclick="selectAge(this)">18</div></div></div>`;container.appendChild(div);}function selectAge(el){const picker=el.closest('.kid-age-picker');picker.querySelectorAll('.selected').forEach(e=>e.classList.remove('selected'));el.classList.add('selected');}function startApp(){const kids=[];const sections=document.querySelectorAll('.setup-section');let valid=true;sections.forEach((sec,idx)=>{const name=sec.querySelector('.kid-name-input').value.trim();const ageEl=sec.querySelector('.age-option.selected');if(!name||!ageEl){valid=false;return;}const age=parseInt(ageEl.textContent);const kidId='kid'+(idx+1);kids.push({id:kidId,name,age,emoji:KID_EMOJIS[idx%KID_EMOJIS.length]});});if(!valid){alert('Fill in all names and ages');return;}state.kids=kids;kids.forEach(kid=>{state.tasks[kid.id]=[{id:'t1',title:'Sample task',emoji:'✅',points:5}];state.rewards[kid.id]=[{id:'r1',title:'Sample reward',emoji:'🎁',cost:10}];state.balance[kid.id]=0;state.approvals[kid.id]=[];state.quest[kid.id]={status:'idle',taskId:null,timer:0};});state.setupComplete=true;saveState();renderApp();}function renderApp(){$('setupView').hidden=state.setupComplete;$('mainView').hidden=!state.setupComplete;if(!state.setupComplete)return;renderKidTabs();renderMainContent();}function renderKidTabs(){const tabs=$('kidTabs');tabs.innerHTML='';state.kids.forEach((kid,idx)=>{const tab=document.createElement('div');tab.className='kid-tab'+(idx===0?' active':'');tab.innerHTML=`<span>${kid.emoji} ${kid.name}</span><span class="remove-kid" onclick="removeKid('${kid.id}')">✕</span>`;tab.onclick=(e)=>{if(!e.target.closest('.remove-kid')){selectKid(kid.id);}};tabs.appendChild(tab);});const addTab=document.createElement('div');addTab.className='kid-tab';addTab.innerHTML='<span>+ Add Kid</span>';addTab.onclick=()=>openAddKidModal();tabs.appendChild(addTab);}function removeKid(kidId){if(state.kids.length<=1){alert('Need at least 1 kid');return;}if(confirm('Remove this kid?')){state.kids=state.kids.filter(k=>k.id!==kidId);delete state.tasks[kidId];delete state.rewards[kidId];delete state.balance[kidId];delete state.approvals[kidId];delete state.quest[kidId];saveState();renderKidTabs();renderMainContent();}}function openAddKidModal(){const name=prompt('Kid name:');if(!name)return;const ageStr=prompt('Kid age (6-18):');const age=parseInt(ageStr);if(!age||age<6||age>18){alert('Invalid age');return;}const kidId='kid_'+Date.now();state.kids.push({id:kidId,name,age,emoji:KID_EMOJIS[state.kids.length%KID_EMOJIS.length]});state.tasks[kidId]=[{id:'t1',title:'Sample task',emoji:'✅',points:5}];state.rewards[kidId]=[{id:'r1',title:'Sample reward',emoji:'🎁',cost:10}];state.balance[kidId]=0;state.approvals[kidId]=[];state.quest[kidId]={status:'idle',taskId:null,timer:0};saveState();renderKidTabs();renderMainContent();}function selectKid(kidId){document.querySelectorAll('.kid-tab').forEach(t=>t.classList.remove('active'));event.target.closest('.kid-tab').classList.add('active');renderMainContent(kidId);}function renderMainContent(kidId=state.kids[0]?.id){if(!state.kids.length)return;const kid=state.kids.find(k=>k.id===kidId);if(!kid)return;const balance=state.balance[kidId]||0;const quest=state.quest[kidId];const approvals=state.approvals[kidId]||[];const tasks=state.tasks[kidId]||[];let html=`<div class="card"><div class="card-head"><div><div class="label-small">${kid.name}'s Reward Bank</div><div class="balance-large">$${balance.toFixed(2)}</div></div></div><div class="reward-bank">${(state.rewards[kidId]||[]).map(r=>`<div class="reward-card"><div class="reward-emoji">${r.emoji}</div><div class="reward-name">${r.title}</div><div class="reward-cost">$${r.cost}</div><button class="reward-btn" ${balance<r.cost?'disabled':''} onclick="claimReward('${kidId}','${r.id}')">Claim</button></div>`).join('')}</div><button class="btn edit" onclick="openRewardModal('${kidId}')">⚙️ Edit Rewards</button></div>`;html+=`<div class="card"><div class="card-head"><h2>Spin the Wheel</h2></div>${renderWheel(kidId)}</div>`;html+=`<div class="card"><div class="card-head"><h2>Approval Queue</h2></div>${approvals.length>0?`<div class="approval-queue">${approvals.map((a,i)=>`<div class="approval-item"><span>${a.task.emoji} <strong>${a.task.title}</strong> — ${a.task.points} pts</span><div class="approval-btns"><button class="btn approve" onclick="approveTask('${kidId}',${i})">Approve</button><button class="btn reject" onclick="rejectTask('${kidId}',${i})">Reject</button></div></div>`).join('')}</div>`:'<p style="color:var(--ink-faint);">No tasks pending approval</p>'}</div>`;html+=`<button class="btn edit" onclick="openTaskModal('${kidId}')">✏️ Edit Tasks</button>`;$('mainContent').innerHTML=html;setTimeout(()=>{if($('wheelCanvas')){drawWheel(kidId,tasks);}},50);}function renderWheel(kidId){const tasks=state.tasks[kidId]||[];const quest=state.quest[kidId];let html=`<div class="wheel-container"><div class="wheel-canvas"><canvas id="wheelCanvas"></canvas><div class="wheel-pointer"></div></div><div class="wheel-info">`;if(quest.status==='spinning'){html+=`<p style="color:var(--ink-soft);">🌀 Spinning...</p>`;}else if(quest.status==='cooldown'){html+=`<p style="color:var(--ink-soft);">⏱️ Cooldown...</p><div class="cooldown-bar"><div class="cooldown-fill" id="cooldownBar"></div></div><p style="font-size:0.85rem;color:var(--ink-faint);"><span id="cooldownTime">15:00</span></p>`;}else if(quest.taskId){const task=tasks.find(t=>t.id===quest.taskId);if(task){html+=`<div class="task-display"><div class="task-emoji">${task.emoji}</div><div><div class="task-title">${task.title}</div><div class="task-points">${task.points} pts</div></div></div><button class="spin-btn" onclick="submitTask('${kidId}','${task.id}')">Done! ✅</button>`;}}else{html+=`<button class="spin-btn" onclick="spinWheel('${kidId}')" ${quest.status==='cooldown'?'disabled':''}>Spin! 🎡</button>`;}html+=`</div></div>`;return html;}function drawWheel(kidId,tasks){const canvas=$('wheelCanvas');if(!canvas||!tasks.length)return;const ctx=canvas.getContext('2d');const size=canvas.parentElement.offsetWidth;canvas.width=size;canvas.height=size;const cx=size/2,cy=size/2,r=size/2-8;const colors=['#FF5E78','#FFD93D','#6BCFB8','#B373FF','#FFB84D','#FF9F1C'];const n=Math.min(6,tasks.length);const slice=Math.PI*2/n;for(let i=0;i<n;i++){const a1=i*slice,a2=a1+slice;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a1,a2);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();const task=tasks[i%tasks.length],a=a1+slice/2,tx=cx+Math.cos(a)*r*0.65,ty=cy+Math.sin(a)*r*0.65;ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(task.emoji,tx,ty);}}function spinWheel(kidId){const quest=state.quest[kidId],tasks=state.tasks[kidId];if(!tasks.length||quest.status==='cooldown')return;quest.status='spinning';renderMainContent(kidId);setTimeout(()=>{quest.taskId=tasks[Math.floor(Math.random()*tasks.length)].id;quest.status='active';renderMainContent(kidId);saveState();},1500);}function submitTask(kidId,taskId){const task=state.tasks[kidId].find(t=>t.id===taskId);if(!task)return;state.approvals[kidId].push({task,taskId});state.quest[kidId]={status:'cooldown',taskId:null,timer:15*60};saveState();renderMainContent(kidId);const interval=setInterval(()=>{state.quest[kidId].timer--;if(state.quest[kidId].timer<=0){clearInterval(interval);state.quest[kidId]={status:'idle',taskId:null,timer:0};renderMainContent(kidId);saveState();}else{saveState();}},1000);}function approveTask(kidId,idx){state.balance[kidId]+=state.approvals[kidId][idx].task.points;state.approvals[kidId].splice(idx,1);saveState();renderMainContent(kidId);}function rejectTask(kidId,idx){state.approvals[kidId].splice(idx,1);saveState();renderMainContent(kidId);}function claimReward(kidId,rewardId){const r=state.rewards[kidId].find(x=>x.id===rewardId);if(r&&state.balance[kidId]>=r.cost){state.balance[kidId]-=r.cost;saveState();renderMainContent(kidId);}}function openTaskModal(kidId){editingKidId=kidId;const list=$('taskList');list.innerHTML='';(state.tasks[kidId]||[]).forEach(t=>{const div=document.createElement('div');div.className='item-row';div.innerHTML=`<input type="text" value="${t.emoji}" maxlength="2" onchange="updateTaskField('${kidId}','${t.id}','emoji',this.value)"><input type="text" value="${t.title}" onchange="updateTaskField('${kidId}','${t.id}','title',this.value)"><input type="number" value="${t.points}" min="1" onchange="updateTaskField('${kidId}','${t.id}','points',parseInt(this.value))"><button class="remove-btn" onclick="removeTask('${kidId}','${t.id}')">✕</button>`;list.appendChild(div);});$('taskModal').classList.add('open');}function updateTaskField(kidId,taskId,field,value){const t=state.tasks[kidId].find(x=>x.id===taskId);if(t){t[field]=value;saveState();}}function removeTask(kidId,taskId){state.tasks[kidId]=state.tasks[kidId].filter(t=>t.id!==taskId);if(!state.tasks[kidId].length){state.tasks[kidId]=[{id:'t1',title:'Sample',emoji:'✅',points:5}];}saveState();openTaskModal(kidId);}function addTask(){const title=$('newTaskTitle').value.trim(),emoji=$('newTaskEmoji').value.trim(),points=parseInt($('newTaskPoints').value);if(!title||!emoji||!points){alert('Fill all fields');return;}state.tasks[editingKidId].push({id:'t'+Date.now(),title,emoji,points});$('newTaskTitle').value='';$('newTaskEmoji').value='';$('newTaskPoints').value='';saveState();openTaskModal(editingKidId);}function closeTaskModal(){$('taskModal').classList.remove('open');}function openRewardModal(kidId){editingKidId=kidId;const list=$('rewardList');list.innerHTML='';(state.rewards[kidId]||[]).forEach(r=>{const div=document.createElement('div');div.className='item-row';div.innerHTML=`<input type="text" value="${r.emoji}" maxlength="2" onchange="updateRewardField('${kidId}','${r.id}','emoji',this.value)"><input type="text" value="${r.title}" onchange="updateRewardField('${kidId}','${r.id}','title',this.value)"><input type="number" value="${r.cost}" min="1" onchange="updateRewardField('${kidId}','${r.id}','cost',parseInt(this.value))"><button class="remove-btn" onclick="removeReward('${kidId}','${r.id}')">✕</button>`;list.appendChild(div);});$('rewardModal').classList.add('open');}function updateRewardField(kidId,rewardId,field,value){const r=state.rewards[kidId].find(x=>x.id===rewardId);if(r){r[field]=value;saveState();}}function removeReward(kidId,rewardId){state.rewards[kidId]=state.rewards[kidId].filter(r=>r.id!==rewardId);if(!state.rewards[kidId].length){state.rewards[kidId]=[{id:'r1',title:'Sample',emoji:'🎁',cost:10}];}saveState();openRewardModal(kidId);}function addReward(){const title=$('newRewardTitle').value.trim(),emoji=$('newRewardEmoji').value.trim(),cost=parseInt($('newRewardCost').value);if(!title||!emoji||!cost){alert('Fill all fields');return;}state.rewards[editingKidId].push({id:'r'+Date.now(),title,emoji,cost});$('newRewardTitle').value='';$('newRewardEmoji').value='';$('newRewardCost').value='';saveState();openRewardModal(editingKidId);}function closeRewardModal(){$('rewardModal').classList.remove('open');}addKidSetup();loadState();</script></body></html>
